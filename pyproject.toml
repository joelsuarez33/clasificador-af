[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clasificador-af"
version = "0.1.0"
description = "Clasificación de Activos Fijos contra el Daimler Group Asset Class Catalogue (Vertex AI Gemini + BigQuery Vector Search)"
readme = "README.md"
# 3.12 es el piso, sin techo: el proyecto corre tambien en 3.13 y 3.14.
requires-python = ">=3.12"
# Pisos, no pines exactos: las versiones viejas de los paquetes compilados
# (pydantic-core, grpcio) no publican wheels cp314 y rompen el install en 3.14.
dependencies = [
    "google-genai>=1.21.1",
    "google-cloud-bigquery>=3.34.0",
    "pydantic>=2.12",   # 2.11.x exige pydantic-core 2.33.2, sin wheel para 3.14
    "grpcio>=1.75.1",   # transitiva de bigquery; 1.75.1 es la primera con wheel cp314
    "tenacity>=8.5.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
]
# Automatizacion SAP (sap/): solo Windows.
sap = [
    "pywin32>=311; sys_platform == 'win32'",   # 311 es la primera con wheel cp314
    "pillow>=11.3.0; sys_platform == 'win32'",
]

[project.scripts]
af-clasificar = "app.classifier_core:main"
af-cargar-catalogo = "preprocess.load_catalogo:main"
af-construir-indice = "preprocess.build_index:main"

[tool.setuptools.packages.find]
include = ["app*", "preprocess*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
